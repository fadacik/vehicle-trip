  services:
    postgres:
      image: postgres:16
      container_name: vehicle-trip-db
      environment:
        POSTGRES_DB: vehicle_trip
        POSTGRES_USER: vehicle_user
        POSTGRES_PASSWORD: vehicle_pass
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U vehicle_user -d vehicle_trip" ]
        interval: 5s
        timeout: 5s
        retries: 10

  volumes:
    pgdata: