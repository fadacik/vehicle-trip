$kind: http-request
description: "Tum araclar (seed: 4 arac)."
url: "{{baseUrl}}/api/vehicles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('4 seed arac listelendi', function () { pm.expect(pm.response.json()).to.be.an('array').with.lengthOf.at.least(4); });
    language: text/javascript
order: 1000
