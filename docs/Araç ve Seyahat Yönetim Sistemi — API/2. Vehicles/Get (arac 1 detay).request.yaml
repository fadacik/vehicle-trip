$kind: http-request
description: "Arac detayi: konum, menzil, durum + kullanim alanlari (zones)."
url: "{{baseUrl}}/api/vehicles/{{vehicleId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('kullanim alanlari dahil', function () { pm.expect(pm.response.json().zones).to.be.an('array').with.lengthOf.at.least(1); });
    language: text/javascript
order: 3000
