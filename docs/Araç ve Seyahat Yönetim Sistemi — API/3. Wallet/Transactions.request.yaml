$kind: http-request
description: Cuzdan hesap hareketleri (TOP_UP / TRIP_CHARGE / REFUND).
url: "{{baseUrl}}/api/users/{{userId}}/wallet/transactions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('en az 1 TOP_UP hareketi', function () { pm.expect(pm.response.json()).to.be.an('array').with.lengthOf.at.least(1); });
    language: text/javascript
order: 3000
