$kind: http-request
name: "9. Tekrar complete (200) + sayac temizligi"
description: "Lock sayaci 2. denemede tukendiigi icin ayni complete basarili: COMPLETED, tek tahsilat, arac AVAILABLE. afterResponse mock sayaclarini sifirlar (koleksiyon sonrasi temiz kalir)."
url: "{{baseUrl}}/api/trips/{{bonusTripId2}}/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "latitude": {{destLat}},
      "longitude": {{destLng}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test('COMPLETED, hasar yok (bu seyahatte fotograf yok)', function () {
        pm.expect(j.status).to.eql('COMPLETED');
        pm.expect(j.damageFee).to.eql(null);
      });
      const base = pm.collectionVariables.get('baseUrl');
      pm.sendRequest({ url: base + '/api/dev/mock/door', method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({ failUnlockCount: 0, failLockCount: 0 }) } }, function () {});
    language: text/javascript
order: 6900
