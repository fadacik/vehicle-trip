$kind: http-request
description: Seyahat detayi.
url: "{{baseUrl}}/api/trips/{{tripId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('ayni seyahat dondu', function () { pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('tripId'))); });
    language: text/javascript
order: 2000
