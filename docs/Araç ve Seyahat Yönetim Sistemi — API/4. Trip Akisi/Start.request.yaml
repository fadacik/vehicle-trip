$kind: http-request
description: "Baslatma: CREATED->ACTIVE, arac AVAILABLE->IN_USE (PESSIMISTIC_WRITE kilidi). Tahminler ve baslangic koordinati aracin GUNCEL konumundan yeniden hesaplanir; menzil (422) ve bakiye (402) kontrolu burada. Bakiye dusulmez, sadece kontrol."
url: "{{baseUrl}}/api/trips/{{tripId}}/start"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (OK)', function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test('durum ACTIVE, startedAt dolu', function () { pm.expect(j.status).to.eql('ACTIVE'); pm.expect(j.startedAt).to.be.a('string'); });
      pm.test('menzil/bakiye gecti (tahminler guncel)', function () { pm.expect(Number(j.estimatedFee)).to.be.above(0); });
    language: text/javascript
order: 3000
