$kind: http-request
description: PENDING kullanimci icin yeni OTP uretir (eski OTP gecersiz olur). Bu koleksiyonda Verify OTP sonrasi PENDING kalmadigi icin beklenen davranis 409 NOT_PENDING'dir; bu yuzden test 200 VEYA 409 kabul eder (ikisi de gecerli kural davranisi).
url: "{{baseUrl}}/api/auth/resend-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{phone}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Durum kodu 200 (yeni OTP) veya 409 NOT_PENDING (kullanici zaten dogrulanmis)', function () { pm.expect([200, 409]).to.include(pm.response.code); });
      if (pm.response.code === 200) {
        const j = pm.response.json();
        pm.test('yeni otp 6 haneli ve yakalandi', function () { pm.expect(j.otp).to.be.a('string').and.have.lengthOf(6); });
        pm.collectionVariables.set('otp', j.otp);
      }
    language: text/javascript
order: 3000
